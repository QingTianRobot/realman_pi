# RealMan Python SDK joint-state driver parameters.
#
# This file is the authoritative starting point for l, m, and r driver instances.
# The single-arm launch argument `namespace` selects one section; the three-arm
# launch starts all sections together.
# The l/m/r mapping follows the physical left-to-right layout. All addresses
# are deployment inputs and must be reachable from the ROS 2 runtime host.
/l/realman_driver:
  ros__parameters:
    # RM65 model identifier. Must match the connected controller and URDF.
    robot_model: RM65-B
    # Left arm controller IPv4 address.
    robot_ip: 192.168.30.123
    # RealMan API2 control port; the official Python quick-start example uses 8080.
    robot_port: 8080
    # Required: ordinary motion completion uses API2 event callbacks available in triple mode.
    thread_mode: RM_TRIPLE_MODE_E
    # Read the real controller by default. Set true only for offline mock tests.
    mock_mode: false
    # Connect during launch so joint-state polling starts without a manual service call.
    auto_connect: true
    # Retry a failed or lost startup connection every 5 seconds; zero disables retries.
    reconnect_interval: 5.0
    # State publication period in Hz. Must be greater than zero.
    state_publish_rate: 10.0
    # Diagnostic: log joint angles around every velocity-session start, the controller's error
    # flags, and a per-session movev send-interval summary. Costs a few extra SDK reads per start.
    velocity_start_trace: true
    # Right before an ordinary motion such as MoveJ, refresh the controller's
    # velocity-passthrough target. off | init | init_zero_stop | canfd_current. Only
    # canfd_current removed the stale-target pull at velocity-session start. The code
    # default is canfd_current, but a driver built before that default changed still
    # defaults to off, so keep it explicit here.
    passthrough_reanchor_mode: canfd_current
    # Pause (ms) between the vendor passthrough init and the first zero command of a session.
    velocity_init_settle_ms: 0.0
    # Republish the latest coordinate safety state so late DDS consumers recover
    # even when the startup sample preceded endpoint discovery. Unit: Hz; > 0.
    coordinate_state_publish_rate: 1.0
    # JointState names must match the unprefixed RM65-B URDF joint names.
    joint_names: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]

