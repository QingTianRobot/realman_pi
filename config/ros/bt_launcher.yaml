# Starts behavior trees for the :8765 page (realman_bt bt_launcher, inside the
# realman_bringup_remote container). Localhost only: realman_web_control proxies it.
bt_launcher:
  bind_host: 127.0.0.1
  port: 8781
  # Every *.xml here can be started; the XML's realman_* root attributes choose arms and launch.
  tree_dir: /opt/rm65_ws/config/behavior-trees
  bt_start: /usr/local/bin/bt-start
  log_dir: /opt/rm65_ws/logs/bt-launcher  # One bt-start output log per Web start.
  instance_lock: /tmp/realman-bt.lock  # Held by any running bt-start, including ./rm65 bt.
  # Same bt-start environment scripts/bt.sh passes; tree, dry run and autostart are added per start.
  env:
    BT_ARM_ID_OVERRIDE: ""
    BT_REQUIRED_ARMS: ""
    BT_REQUIRED_ACTIONS: ""
    BT_LAUNCH_FILE: ""
    BT_STOP_ON_TERMINAL: ""
    BT_EXIT_ON_TERMINAL: ""
    BT_SERVER_HOST: 0.0.0.0
    BT_SERVER_PORT: 8080
    BT_READ_ONLY: true
    BT_RUNTIME_SNAPSHOT: /tmp/realman-bt-workspace/runtime.json
    BT_RUNTIME_ARCHIVE_ROOT: /opt/rm65_ws/logs/behavior-trees
