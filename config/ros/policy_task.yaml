# Policy task run by the behavior tree (config/behavior-trees/control.xml, policy branch): how many cycles and attempts,
# and every threshold PolicyRun and GripperReady judge an attempt by. Design:
# docs/superpowers/specs/2026-10-14-policy-task-in-bt-design.md. Loaded by control_router.launch.py as parameters of the
# executor; policy_task_params.cpp declares exactly these keys, and test_policy_task_config_file.py fails if the file and
# the loader disagree (ROS would otherwise ignore a mistyped key and use the default).
#
# Change a threshold only together with the data it came from. Edits need a restart of ./rm65 bt.
realman_bt_executor:
  ros__parameters:
    policy_task:
      # Cycles that have to succeed, and failed attempts allowed within one cycle (the first try counts). -1 = no limit.
      cycles: 1
      attempts: 3
      # Policy-server timeouts, retried on a budget of their own (they do not use up `attempts`): the bridge paused
      # itself after failure_pause_threshold inference requests in a row timed out (policy_bridge.yaml
      # infer_timeout_s), its stats went silent for stats_stale_sec, it was not ready within service_wait_sec, or
      # /policy/activate did not answer. Each retry first waits backoff_sec with the bridge stopped, then opens the
      # gripper and goes back to the start pose like any retry. 20 s covers the ~26 s JIT compile of the first inference
      # after a serve restart (the bridge needs ~8 s of timeouts to pause) and a short Wi-Fi collapse (2026-10-14/16).
      # attempts: timeouts allowed per cycle, the first counts; -1 = no limit. Reaching it ends the task (FAILED).
      timeout_retry:
        attempts: 3
        backoff_sec: 20.0
      arm: r
      # auto: PolicyRun calls /policy/activate itself once the preflight checks pass, so selecting the policy mode is
      #   enough to start a run (the arms first go to the start pose). operator: PolicyRun only waits until a person
      #   has called /policy/activate and supervises from there; every attempt waits again.
      activation: auto
      # Must match policy_bridge.yaml downlink.command_namespace (checked by a test).
      command_namespace: /pi05_policy
      # Must match policy_bridge.yaml prompt.topic (checked by a test). PolicyRun publishes its task's prompt here and
      # starts only once /policy/stats reports that the bridge uses it.
      prompt_topic: /policy/prompt

      # The tasks the served policy was trained on; the BT's PolicyRun picks one with its `task` port. A prompt must be
      # the training view's task text VERBATIM (meta/tasks.parquet; for m_multitask_b16_2gpu also contract.json
      # `prompts`): one character off and the model is out of distribution without any error. completion is how a
      # successful attempt ends: release_over_bin (the `release` block below) or lift_and_hold (the `lift` block).
      # ROS parameters cannot list keys, so every task is named in task_names first.
      task_names: [place, pick]
      tasks:
        place:
          prompt: "pick up the power adapter and put it in the blue bin"
          completion: release_over_bin
        pick:
          prompt: "pick up the power adapter"
          completion: lift_and_hold
      gripper_for_arm:
        l: gripper_left
        m: gripper_mid
        r: gripper_right

      # RealMan degrees. p1 and p99 of every frame of the 130 demonstration episodes, widened by 10 degrees each side
      # (2026-10-14). The J5 floor is 20 even though the demos reach 5.6: that is too close to the wrist singularity
      # to let the policy go there.
      joint_envelope_deg:
        lo: [-73.4, 5.0, -16.2, -28.4, 20.0, -125.1]
        hi: [40.1, 107.0, 124.3, 70.8, 108.2, 49.0]
      # Between joint_states samples at least ~0.1 s apart. The runs on 2026-10-14 never exceeded this.
      max_joint_speed_dps: 50.0
      # The two arms that are not driven must stay where they were when the attempt started.
      lm_drift_limit_deg: 1.0
      # No joint_states from an arm for this long, or no /policy/stats for stats_stale_sec (published at 1 Hz).
      joint_state_stale_sec: 1.0
      stats_stale_sec: 5.0
      # How long the preflight waits for the four stop/start services and the data before it gives up (a fault).
      service_wait_sec: 10.0
      # Reply timeout for one service call; the stop sequence continues without the reply after this.
      service_call_timeout_sec: 2.0
      # No success (release over the bin, or lift-and-hold) within this long is a retryable timeout. Demonstrations last
      # 11 to 27 s (median 18 s) for place; the 2026-10-19 pick runs lifted within 11-14 s.
      max_attempt_sec: 45.0
      # Retryable stall: the gripper is closed and the commanded velocity stays below both limits for sec.
      # 2026-10-14 cycle 2 held an adapter and then commanded ~0.001 m/s for 30 s.
      stall:
        cmd_lin_mps_below: 0.01
        cmd_ang_radps_below: 0.04
        sec: 8.0

      # Release = the policy's gripper command goes above open_above after it has been below closed_below for
      # min_closed_sec in total, while the arm is over the bin (joint_index below joint_below_deg; J1 is far negative
      # on the bin side). The position test keeps the policy's retry-opens over the mat from ending an attempt.
      release:
        open_above: 0.8
        closed_below: 0.2
        min_closed_sec: 3.0
        joint_index: 0
        joint_below_deg: -35.0
        # The attempt is supervised for this long after the release command so the gripper really opens.
        settle_sec: 1.0
      # lift_and_hold tasks. After the policy first closes the gripper (command below release.closed_below), the
      # attempt succeeds once the jaws hold the object (position below verdict.empty_position_min with torque), the
      # gripper has been commanded closed for min_closed_sec, joint joint_index has moved joint_delta_deg from its value
      # at the close (negative = decreasing; J2 decreases as the arm lifts), and that lasts hold_sec. The gripper stays
      # closed on the object. Dropped (retryable): held, then the position reached empty_position_min while still
      # commanded closed. Wrong task (a fault, not retried): joint wrong_side_joint_index below wrong_side_below_deg
      # after the close, i.e. the arm heads for the bin under the pick prompt. Measured 2026-10-19: pick runs lifted J2
      # by 11-40 deg and kept J1 near +8; place runs turn J1 to about -60.
      lift:
        min_closed_sec: 3.0
        joint_index: 1
        joint_delta_deg: -10.0
        hold_sec: 2.0
        wrong_side_joint_index: 0
        wrong_side_below_deg: -25.0
      # Grasp verdict: the median gripper position over the last window_sec of the closed phase, with torque_reached
      # seen, means the object was held. Measured 2026-10-14: held ~5700-5800 with torque, empty 8380-8480 without.
      verdict:
        window_sec: 3.0
        empty_position_min: 7800.0
      # GripperReady: position (device units, open ~50, closed 8500) at or below this counts as open.
      gripper_ready:
        open_position_max: 500.0
        timeout_sec: 20.0
        position_stale_sec: 2.0
      # One CSV per attempt: the right arm's joints, the other arms' drift, the gripper and the commanded speeds, every
      # period_sec, with result / grasp / seconds / reason at the end. It is the record of WHY an attempt ended: the
      # behavior tree's own event list only keeps the last 200 events and the Web page's polling fills it. The directory is
      # the host's ~/realman_pi/logs/policy-attempts (the bringup container mounts logs/ read-write). A trace that cannot
      # be written never affects the attempt.
      trace:
        enabled: true
        dir: /opt/rm65_ws/logs/policy-attempts
        period_sec: 0.1
      # Pick-and-clear cycle of config/behavior-trees/control_pick.xml (the pick task, repeated until the table is
      # clear). After an attempt lifts the object, the right arm goes to lift_joint_degrees, turns joint release_joint
      # (1-based: 1 = J1) to release_joint_deg, opens the gripper there and WhiteObjectsRemain checks the table.
      # lift_joint_degrees is the right arm's start pose (pika_config.yaml) until a dedicated lift pose is measured
      # (decision 2026-10-20). Velocities are the XML's (10%). The turn from the lift pose to J1 -135 (clockwise seen from
      # above) was run on the robot at 5% without an object on 2026-10-20 and the operator saw no obstacle on the path.
      pick_cycle:
        lift_joint_degrees: [-9.89, 18.046, 79.074, 15.505, 79.606, -6.194]
        release_joint: 1
        release_joint_deg: -135.0
      # WhiteObjectsRemain: white blobs on the mat in the global D435 image mean objects are left. roi_xywh is the
      # green mat in the 640x480 image (pixels: x, y, width, height). A pixel is white when its smallest RGB channel is
      # at least min_channel and max-min of its channels is at most max_chroma; it counts only if its whole
      # erode_px x erode_px square is white, which removes the thin white cables. min_pixels such pixels = an object is
      # left. Measured 2026-10-20 on recorded D435 frames: adapters 110-170 per channel, mat below 40, one adapter keeps
      # 100-500 pixels, cables 0. The image used is the first one received settle_sec after the check started (the
      # arm has parked by then); none within timeout_sec more fails the task. Re-measure after moving the camera.
      object_detection:
        image_topic: /camera_global/d435/color/image_raw
        roi_xywh: [235, 125, 250, 230]
        min_channel: 90
        max_chroma: 40
        erode_px: 9
        min_pixels: 80
        settle_sec: 1.0
        timeout_sec: 5.0
      # After the stop calls, wait this long for the router to release its velocity session (its input_timeout_ms is
      # 500) so the next ThreeArmMoveJ does not fight it.
      router_release_sec: 1.5
