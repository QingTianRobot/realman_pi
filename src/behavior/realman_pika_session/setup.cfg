[develop]
script_dir=$base/lib/realman_pika_session
[install]
install_scripts=$base/lib/realman_pika_session
[tool:pytest]
# The image's pip anyio ships a pytest plugin that cannot import under the system
# pytest 6.2.5 (No module named '_pytest.scope'), which kills the run before any test.
addopts = -p no:anyio
