<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Factory and function registry flow</title>
  <desc id="desc">XML creates FunctionAction through NodeFactory, then invokes FunctionRegistry and reads/writes Blackboard.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d50"/>
    </marker>
  </defs>
  <rect width="1040" height="360" fill="#fbf4e6" rx="20"/>
  <g font-family="Arial, sans-serif" font-size="16" fill="#18211f">
    <rect x="54" y="120" width="180" height="86" rx="14" fill="#fff" stroke="#2f5d50" stroke-width="2"/>
    <text x="86" y="154" font-weight="700">XML</text>
    <text x="86" y="180" font-size="13">&lt;FunctionAction/&gt;</text>

    <rect x="300" y="120" width="190" height="86" rx="14" fill="#fff" stroke="#2f5d50" stroke-width="2"/>
    <text x="330" y="154" font-weight="700">NodeFactory</text>
    <text x="330" y="180" font-size="13">create node by tag</text>

    <rect x="556" y="120" width="200" height="86" rx="14" fill="#fff" stroke="#2f5d50" stroke-width="2"/>
    <text x="586" y="154" font-weight="700">FunctionRegistry</text>
    <text x="586" y="180" font-size="13">std::function by name</text>

    <rect x="822" y="120" width="164" height="86" rx="14" fill="#2f5d50" stroke="#23463c" stroke-width="2"/>
    <text x="852" y="154" font-weight="700" fill="#fff">Blackboard</text>
    <text x="852" y="180" font-size="13" fill="#fff">typed shared data</text>

    <line x1="234" y1="163" x2="292" y2="163" stroke="#2f5d50" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="490" y1="163" x2="548" y2="163" stroke="#2f5d50" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="756" y1="163" x2="814" y2="163" stroke="#2f5d50" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M904 206 C904 282 144 282 144 206" fill="none" stroke="#8b5e34" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="390" y="300" font-size="14" fill="#8b5e34">Function callbacks can read and write shared state without changing XML shape.</text>
  </g>
</svg>
