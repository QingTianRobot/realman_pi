# Pika entry pose. Joint angles are RealMan degrees; only joint_degrees are
# consumed by the behavior-tree router. TCP pose fields remain available to
# Pika clients but are not used for the entry MoveJ.
pika_default_pose:
  left:
    joint_degrees: [12.172, 25.223, 73.054, -16.703, 80.307, 14.455]
    tcp_pose:
      position: [-0.323, -0.028, 0.304]
      orientation_xyzw: [0.990, 0.003, -0.045, -0.137]
  middle:
    joint_degrees: [0.0, 17.997, 70.0, 0.0, 90.0, 8.997]
  right:
    joint_degrees: [-9.89, 18.046, 79.074, 15.505, 79.606, -6.194]
    tcp_pose:
      position: [-0.299, 0.014, 0.319]
      orientation_xyzw: [0.989, -0.052, -0.047, 0.128]
  velocity_percent: 10
  blend_radius_percent: 0
  timeout_sec: 120

# Pika owns a real-time l/r Cartesian velocity stream while pikavelocity is
# active. The driver applies this per-session limit. It is raised to 1.0 m/s,
# the l/r hard_max_linear_speed_mps in realman_motion.yaml, so a hand moving
# faster than 0.15 m/s is no longer clamped; it is declared separately so Pika
# teleop can be retuned without moving every client's limit.
pika_velocity:
  # Use per-arm identity WORK frames so Pika BASE-expressed vectors remain unchanged.
  work_reference: work/pikabase
  # Pika publishes at 20 Hz, but production DDS scheduling can occasionally
  # introduce gaps above the driver's 100 ms watchdog. The router re-sends the
  # latest valid command at the control period while it is younger than
  # stale_ms, so such gaps never end the session. Older input is not replayed:
  # the arm is commanded to zero (a paused Pika stream stops the arm instead of
  # repeating its last velocity), but the session is kept. Must exceed the
  # 50 ms Pika period and stay below input_timeout_ms.
  stale_ms: 200
  # Only input older than this releases the velocity session. Re-opening one
  # re-runs rm_set_movev_canfd_init, so the session outlives short pauses.
  input_timeout_ms: 3000
  max_linear_speed_mps: 1.0
  # Pika angular commands are accepted up to 2.0 rad/s after the Pika-side unit
  # conversion. A 0.25 rad/s cap clamped ordinary hand rotation (measured
  # ~0.45 rad/s on production) and made the wrist feel sluggish. Ordinary
  # Web/keyboard sessions keep their lower driver limit.
  max_angular_speed_radps: 2.0
  # The matching ramp reaches the 2.0 rad/s limit in about 0.5 seconds from
  # rest, which stays smooth without feeling unresponsive.
  max_angular_accel_radps2: 4.0

# Pika / Mixed: XYZ follows the Pika linear velocity from
# /pika/<arm>/cartesian_velocity, while the orientation follows how the Pika
# has rotated since the session started (from /pika/<arm>/cartesian_pose). The
# first Pika orientation is paired with the arm orientation at activation and
# later Pika rotations are applied to the arm in the base frame, so the Pika
# frame need not be aligned with the arm and activation does not turn the
# wrist. Both drive one absolute pose session (the same IK + joint passthrough
# path as Pika position mode), so the tool orientation tracks the hand without
# the drift of integrating angular velocity. The Pika sender must publish both
# topics while this mode is active; the angular part of the velocity stream
# and the position part of the pose stream are ignored.
pika_mixed:
  # Velocity older than this counts as zero, so the target decelerates and
  # holds; an orientation older than this is held. Must exceed the 50 ms Pika
  # period and stay below input_timeout_ms.
  stale_ms: 200
  # The session is released only when both streams are older than this.
  input_timeout_ms: 3000
  # Integration limits for the XYZ target. The speed must not exceed the
  # router-wide max_linear_speed_mps the pose goal carries (0.15 m/s).
  max_linear_speed_mps: 0.15
  max_linear_accel_mps2: 0.10
  # Rate at which the commanded orientation turns toward the Pika-derived goal,
  # so a fast or jumpy hand rotation becomes a smooth one. Must not exceed the
  # router's 0.25 rad/s ceiling.
  max_angular_speed_radps: 0.25
  # The XYZ target may lead the measured TCP by at most this distance. If the
  # arm stops following (IK failure, singularity), the target stops too instead
  # of running ahead and snapping the arm forward when motion resumes.
  max_position_lead_m: 0.05
  # The commanded orientation may lead the measured TCP orientation by at most
  # this angle, in radians. When the arm cannot follow (an unreachable
  # orientation makes IK fail), the target stops at the arm instead of turning
  # on, so rotating the Pika back recovers control immediately.
  max_orientation_lead_rad: 0.15
  # How often the measured TCP pose is read for that leash, in Hz. Each read is
  # one get_current_pose call (joint read + forward kinematics) on the driver.
  pose_poll_hz: 10.0
