services:
  rm65_rviz:
    image: rm65-humble-rviz:local
    build:
      context: .
      dockerfile: docker/ros2-humble-rviz.Dockerfile
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-65}
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:?XAUTHORITY must point to the active X11 authority file}:/tmp/.Xauthority:ro
    stdin_open: true
    tty: true
    command:
      - ros2
      - launch
      - rm65_description
      - display.launch.py
      - model:=${RM65_MODEL:-RM65-B}
