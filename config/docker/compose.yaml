# Runtime services for the RM65 ROS 2 Humble system. The repository-root
# docker-compose.yml includes this file so standard commands still work while
# substantive configuration stays under config/.
x-realman-common: &realman-common
  image: rm65-humble-rviz:local
  build:
    context: .
    dockerfile: config/docker/ros2-humble-rviz.Dockerfile
    args:
      # Domestic defaults accelerate first-time builds. Every value can be
      # replaced by an official upstream or an internal mirror at invocation.
      ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:-docker.m.daocloud.io/library/ros:humble-ros-base}
      UBUNTU_APT_MIRROR: ${UBUNTU_APT_MIRROR:-https://mirrors.aliyun.com/ubuntu}
      UBUNTU_PORTS_APT_MIRROR: ${UBUNTU_PORTS_APT_MIRROR:-https://mirrors.aliyun.com/ubuntu-ports}
      ROS2_APT_MIRROR: ${ROS2_APT_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/ros2/ubuntu}
      PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
  network_mode: host
  ipc: host
  environment:
    # Host networking plus ROS_LOCALHOST_ONLY=0 exposes DDS discovery to remote
    # Humble hosts using the same domain. Firewalls must permit DDS UDP traffic.
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    REALMAN_CONFIG_ROOT: /opt/rm65_ws/config
    REALMAN_LOG_ROOT: /opt/rm65_ws/logs
    # The launch file scans this path/glob and waits when it is not present.
    REALMAN_JOY_DEVICE: ${REALMAN_JOY_DEVICE:-auto}
  volumes:
    # Runtime config edits take effect on the next launch without rebuilding.
    - ./config:/opt/rm65_ws/config:ro
    # Keep ROS 2's timestamped run directories and node log files on the host.
    - ./logs:/opt/rm65_ws/logs
  stdin_open: true
  tty: true

x-rm65-rviz-common: &rm65-rviz-common
  <<: *realman-common
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    REALMAN_CONFIG_ROOT: /opt/rm65_ws/config
    REALMAN_LOG_ROOT: /opt/rm65_ws/logs
    REALMAN_JOY_DEVICE: ${REALMAN_JOY_DEVICE:-auto}
    # Forward the active desktop display and force software rendering to avoid
    # host/container OpenGL driver mismatches.
    DISPLAY: ${DISPLAY:-}
    LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
    QT_X11_NO_MITSHM: "1"
    XAUTHORITY: /tmp/.Xauthority
  volumes:
    - ./config:/opt/rm65_ws/config:ro
    - ./logs:/opt/rm65_ws/logs
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # /dev/null keeps headless service selection parseable without X11. Graphical
    # services still require XAUTHORITY to point to the active session's file.
    - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
    # Mount the authoritative root configuration read-only so TF layout edits
    # take effect on the next container start without rebuilding the image.
    - ./config:/opt/rm65_ws/install/rm65_description/share/rm65_description/config:ro
  stdin_open: true
  tty: true

services:
  # Existing single-arm viewer, retained for model inspection.
  rm65_rviz:
    <<: *rm65-rviz-common
    command:
      - ros2
      - launch
      - rm65_description
      - display.launch.py
      - model:=${RM65_MODEL:-RM65-B}

  # Three-arm environment using the l, m, and r namespaces and TF prefixes.
  rm65_three_rviz:
    <<: *rm65-rviz-common
    command:
      - ros2
      - launch
      - rm65_description
      - three_robots.launch.py
      - use_gui:=${RM65_USE_GUI:-false}

  # Three-arm viewer driven by real controller joint states. This service does
  # not start Xbox or joystick nodes, so the driver/RViz path can be tested alone.
  realman_driver_rviz:
    <<: *rm65-rviz-common
    command:
      - ros2
      - launch
      - realman_bringup
      - system.launch.py
      - start_driver:=true
      - start_joy_driver:=false
      - start_controller:=false
      - use_gui:=false
      - use_rviz:=true

  # Full system bringup with three arms, RViz 2, and a physical Xbox controller.
  realman_bringup:
    <<: *rm65-rviz-common
    volumes:
      - ./config:/opt/rm65_ws/config:ro
      - ./logs:/opt/rm65_ws/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
      - ./config:/opt/rm65_ws/install/rm65_description/share/rm65_description/config:ro
      # Keep the directory mounted so a controller can be plugged in after the
      # container starts. The launch file waits for the selected device.
      - /dev/input:/dev/input:ro
    device_cgroup_rules:
      # Linux input event devices use character-device major 13.
      - "c 13:* r"
    command:
      - ros2
      - launch
      - realman_bringup
      - system.launch.py
      - wait_for_joy_device:=true
      - use_gui:=${RM65_USE_GUI:-false}
      - use_rviz:=${RM65_USE_RVIZ:-true}

  # Parameterized bringup for development and diagnostics. The fixed services
  # above remain the stable operator presets; this target exposes the launch
  # package switches through .env without requiring a Compose-file edit.
  realman_bringup_custom:
    <<: *rm65-rviz-common
    volumes:
      - ./config:/opt/rm65_ws/config:ro
      - ./logs:/opt/rm65_ws/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
      - ./config:/opt/rm65_ws/install/rm65_description/share/rm65_description/config:ro
      # The Joy node is optional, but mapping the input directory lets one
      # .env profile switch it on without changing the service definition.
      - /dev/input:/dev/input:ro
    device_cgroup_rules:
      - "c 13:* r"
    command:
      - ros2
      - launch
      - realman_bringup
      - system.launch.py
      - start_robots:=${REALMAN_START_ROBOTS:-true}
      - start_driver:=${REALMAN_START_DRIVER:-true}
      - start_joy_driver:=${REALMAN_START_JOY_DRIVER:-false}
      - start_controller:=${REALMAN_START_CONTROLLER:-false}
      - use_gui:=${REALMAN_USE_GUI:-false}
      - use_rviz:=${REALMAN_USE_RVIZ:-false}
      - start_web_control:=${REALMAN_START_WEB_CONTROL:-false}
      - wait_for_joy_device:=${REALMAN_WAIT_FOR_JOY_DEVICE:-false}
      - joy_device_path:=${REALMAN_JOY_DEVICE:-auto}
      - joy_poll_interval:=${REALMAN_JOY_POLL_INTERVAL:-1.0}
      - driver_config_file:=${REALMAN_DRIVER_CONFIG_FILE:-/opt/rm65_ws/config/ros/realman_driver.yaml}
      - coordinates_config_file:=${REALMAN_COORDINATES_CONFIG_FILE:-/opt/rm65_ws/config/ros/realman_coordinates.yaml}
      - motion_config_file:=${REALMAN_MOTION_CONFIG_FILE:-/opt/rm65_ws/config/ros/realman_motion.yaml}
      - web_control_config_file:=${REALMAN_WEB_CONTROL_CONFIG_FILE:-/opt/rm65_ws/config/ros/realman_web_control.yaml}

  # Headless remote-debug target. Publish sensor_msgs/Joy from another Humble
  # host on the same ROS_DOMAIN_ID to exercise the controller node without USB.
  realman_bringup_remote:
    <<: *realman-common
    # Keep the production ROS graph available after host reboot, Docker daemon
    # restart, or an unexpected launch/container exit. Operators can still stop
    # it intentionally with `docker compose stop realman_bringup_remote`.
    restart: unless-stopped
    command:
      - ros2
      - launch
      - realman_bringup
      - system.launch.py
      - start_joy_driver:=false
      - use_gui:=false
      - use_rviz:=false
      - start_web_control:=${REALMAN_START_WEB_CONTROL:-false}

  # Browser action console. It joins an existing ROS graph and serves the
  # packaged URDF/static UI on http://<industrial-host>:8765/.
  realman_web_control:
    <<: *realman-common
    command:
      - ros2
      - launch
      - realman_web_control
      - web_control.launch.py

  # RViz-only viewer for a remote realman_bringup_remote ROS graph. It does not
  # start a local driver, robot_state_publisher, or fake joint-state publisher.
  realman_remote_rviz:
    <<: *rm65-rviz-common
    command:
      - ros2
      - launch
      - realman_bringup
      - remote_rviz.launch.py

  # RViz-only camera viewer. It subscribes to the production Orbbec image
  # topics and never starts a RealMan driver or local camera device.
  realman_camera_rviz:
    <<: *rm65-rviz-common
    command:
      - rviz2
      - -d
      - /opt/rm65_ws/config/rviz/cameras.rviz

  # Standalone Xbox validation. This starts only the SDL Joy publisher and the
  # C++ button logger, so a controller can be tested without RViz or robot TF.
  xbox_controller_test:
    <<: *realman-common
    volumes:
      - ./config:/opt/rm65_ws/config:ro
      - ./logs:/opt/rm65_ws/logs
      # Keep the directory mounted so the controller can be connected later.
      - /dev/input:/dev/input:ro
    device_cgroup_rules:
      - "c 13:* r"
    command:
      - ros2
      - launch
      - realman_bringup
      - system.launch.py
      - start_robots:=false
      - start_driver:=false
      - start_joy_driver:=true
      - start_controller:=true
      - wait_for_joy_device:=true
      - use_gui:=false
      - use_rviz:=false

  # Standalone RealMan joint-state driver test. All l/m/r instances use the annotated
  # mock configuration, so this service never contacts physical controllers.
  realman_driver_test:
    <<: *realman-common
    command:
      - ros2
      - launch
      - realman_robot_driver
      - three_realman_drivers.launch.py
      - config_file:=/opt/rm65_ws/config/ros/realman_driver_mock.yaml
