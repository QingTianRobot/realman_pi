# Hold-to-run arm velocities and press-once gripper targets for l/r only.
version: 1

# The browser sends its complete pressed-key set at this interval.
heartbeat_period_ms: 50
# One velocity session lives for the whole keyboard activation: it opens as
# soon as keyboard mode is active and the browser heartbeat arrives, before any
# key is pressed, and key presses, releases and direction changes only change
# the command. Re-opening a session re-runs rm_set_movev_canfd_init, and the
# start of a session is where non-commanded-axis transients appear.
#
# A heartbeat older than this stops the arm (zero velocity) but keeps the
# session, so a short network stall costs no re-initialisation.
input_timeout_ms: 150
# A heartbeat older than this means the browser is gone (closed, blurred or
# hidden tab): only then is the session released. Must exceed input_timeout_ms.
input_lost_ms: 1000

# Fractions multiply per-arm maxima from realman_motion.yaml.
# The l/r linear maximum was raised to 0.15 m/s for Pika teleop; this fraction
# keeps a held key at 0.02 m/s (0.13333333 x 0.15), the speed keyboard control
# was tuned and measured at. The arm keeps moving briefly after a release, so a
# faster key speed means a longer coast; retune this, not the shared maximum.
linear_speed_fraction: 0.13333333
angular_speed_fraction: 0.4

# Physical KeyboardEvent.code values; globally unique across arms and grippers.
# One press submits a full target (release does not cancel it). Endpoints remain
# authoritative in gripper.yaml: open = 1.0, close = 0.0.
grippers:
  l: {open: Digit1, close: Digit2}
  r: {open: Digit9, close: Digit0}

arms:
  l:
    vx: {positive: KeyW, negative: KeyS}
    vy: {positive: KeyA, negative: KeyD}
    vz: {positive: KeyR, negative: KeyF}
    wx: {positive: KeyQ, negative: KeyE}
    wy: {positive: KeyZ, negative: KeyC}
    wz: {positive: KeyX, negative: KeyV}
  r:
    vx: {positive: KeyI, negative: KeyK}
    vy: {positive: KeyJ, negative: KeyL}
    vz: {positive: KeyU, negative: KeyO}
    wx: {positive: KeyY, negative: KeyP}
    wy: {positive: KeyN, negative: KeyM}
    wz: {positive: KeyB, negative: KeyG}
