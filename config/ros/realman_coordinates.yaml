# Desired controller coordinate profiles for the three fixed RM65 arms.
# These are desired state only: startup verifies and blocks motion on a mismatch;
# it never writes controller frames without an explicit apply/select request.
version: 1
policy:
  # Startup reads the active controller frames. No controller write is implicit.
  on_start: verify
  # A controller/profile discrepancy is a safety boundary for later motion actions.
  on_mismatch: block_motion

robots:
  l:
    default_tool: gripper
    default_work: table
    tool_frames:
      gripper:
        # RealMan controller names are limited to 9 usable ASCII characters.
        controller_name: l_tool
        # TF frame IDs are namespaced to prevent collisions between arms.
        ros_frame_id: l/tool0
        # Tool origin in metres; Euler angles are intentionally not authoritative.
        xyz_m: [0.0, 0.0, 0.0]
        # Unit quaternion in w, x, y, z order; loader normalizes valid input.
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        # Payload mass in kilograms and centre of mass in metres from tool origin.
        payload_kg: 0.0
        center_of_mass_m: [0.0, 0.0, 0.0]
    work_frames:
      table:
        controller_name: l_work
        ros_frame_id: l/work0
        # Work origin in metres; use calibrated values only after explicit apply.
        xyz_m: [0.0, 0.0, 0.0]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]

  m:
    default_tool: gripper
    default_work: table
    tool_frames:
      gripper:
        controller_name: m_tool
        ros_frame_id: m/tool0
        xyz_m: [0.0, 0.0, 0.0]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        payload_kg: 0.0
        center_of_mass_m: [0.0, 0.0, 0.0]
    work_frames:
      table:
        controller_name: m_work
        ros_frame_id: m/work0
        xyz_m: [0.0, 0.0, 0.0]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]

  r:
    default_tool: gripper
    default_work: table
    tool_frames:
      gripper:
        controller_name: r_tool
        ros_frame_id: r/tool0
        xyz_m: [0.0, 0.0, 0.0]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
        payload_kg: 0.0
        center_of_mass_m: [0.0, 0.0, 0.0]
    work_frames:
      table:
        controller_name: r_work
        ros_frame_id: r/work0
        xyz_m: [0.0, 0.0, 0.0]
        quaternion_wxyz: [1.0, 0.0, 0.0, 0.0]
