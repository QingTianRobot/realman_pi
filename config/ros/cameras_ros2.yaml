# ROS 2 Orbbec bringup defaults for the three cameras on the production rig.
# Select by serial number because USB bus paths can change after re-plugging.
cameras:
  left:
    # Physical left camera. This mapping was verified after the initial
    # installation had left and right serials reversed.
    serial: "CV2L36000037"
    color:
      # The glossy calibration board clips under auto exposure in this view.
      # Gemini 305 exposure units are 0.1 ms, so 30 is a fixed 3 ms exposure.
      auto_exposure: false
      exposure: 30
  middle:
    serial: "CV2T661000DC"
  right:
    # Physical right camera; keep this aligned with camera_stream/orbbec.yaml.
    serial: "CV2L360000HS"

# Gemini 305 devices share the USB2 bus on the production host. These profiles
# keep all three devices within the available bandwidth.
streams:
  color:
    width: 640
    height: 480
    # Uncompressed YUYV avoids persistent MJPEG frame tearing on the right
    # Gemini 305. At 640x480@10, all three streams remain within USB2 headroom.
    fps: 10
    format: YUYV
  depth:
    # Gemini 305 interprets these as the sensor profile before hardware
    # decimation. 640x480 with factor 2 publishes 320x240 depth images.
    width: 640
    height: 480
    fps: 15
    format: Y16
    decimation_factor: 2

# ROS2 bringup defaults to color-only. The wrapper can publish color or depth
# reliably on this USB2 topology, but not both streams from one camera at once.
mode: color

# Host prerequisite: all production cameras share a USB2 root hub. Set
# /sys/module/usbcore/parameters/usbfs_memory_mb to at least 256 MB before
# starting all three streams. The launch does not change kernel settings.

# Each camera is independent on this USB2 topology.  The wrapper's default
# frame-sync/software-trigger settings can leave later devices with a live
# publisher but no frames, so keep hardware/software triggering disabled.
sync:
  enable_frame_sync: false
  trigger_out_enabled: false
  software_trigger_enabled: false

# Global RealSense D435, published through the native realsense2_camera node so
# the ROS 2 image topics stay the single source of truth for calibration/RViz.
# The driver lives in the src/sensor/realsense submodules; when they are not
# built, rm65_camera_ros2 auto-degrades to use_realsense:=false and the three
# Orbbec streams still start.
global_camera:
  enabled: true
  device_type: d435
  # Production D435 serial; keep aligned with camera_stream/realsense.yaml.
  serial_no: "346222072431"
  namespace: camera_global
  camera_name: d435
  color:
    # USB2 topology limit; raise to 1280x720x30 after moving to a USB3 port.
    width: 424
    height: 240
    fps: 15
  depth:
    # D435 cannot stream depth alongside three Orbbec devices on USB2 today.
    enable: false
    width: 480
    height: 270
    fps: 15
  align_depth: false
  pointcloud: false
  # Mount pose of the D435 in the shared `world` frame. Placeholder identity
  # until the global-camera extrinsic is measured; edit after installation.
  # The static TF connects world -> <child_frame> so the D435 joins the same
  # tree as the Orbbec optical frames.
  tf:
    parent_frame: world
    child_frame: d435_link
    x: 0.0
    y: 0.0
    z: 0.0
    roll: 0.0
    pitch: 0.0
    yaw: 0.0
