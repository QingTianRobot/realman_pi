# Changingtek gripper topology. Position values are device units (normally
# 0.01 mm); speed and force values are percentages in the range 0..100.
# Stable udev aliases keep each physical gripper mapped to the same ROS name.
buses:
  - port: /dev/realman/gripper_right
    baudrate: 115200
    timeout: 0.3
    poll_hz: 20.0
    auto_reconnect: true
    reconnect_interval: 5.0
    command_quiet_s: 0.2           # 目标持续到达的判定间隔
    streaming_poll_interval: 0.5   # 连续控制期间的反馈轮询周期（越大下发越稳）
    min_command_interval_s: 0.25   # 连续目标的最小触发间隔；实测 20 Hz 触发夹爪不动，4 Hz 最快
    command_deadband: 0.01         # 与上次目标相差小于行程该比例则不重发（全开/全闭端点除外）
    grippers:
      - name: gripper_right
        slave_id: 1
        open_position: 4000
        close_position: 12000
        min_position: 0
        max_position: 12000
        speed_pct: 100
        force_pct: 60
        accel: 2000
        decel: 2000
  - port: /dev/realman/gripper_left
    baudrate: 115200
    timeout: 0.3
    poll_hz: 20.0
    auto_reconnect: true
    reconnect_interval: 5.0
    command_quiet_s: 0.2           # 目标持续到达的判定间隔
    streaming_poll_interval: 0.5   # 连续控制期间的反馈轮询周期（越大下发越稳）
    min_command_interval_s: 0.25   # 连续目标的最小触发间隔；实测 20 Hz 触发夹爪不动，4 Hz 最快
    command_deadband: 0.01         # 与上次目标相差小于行程该比例则不重发（全开/全闭端点除外）
    grippers:
      - name: gripper_left
        slave_id: 1
        open_position: 400
        close_position: 949
        min_position: 0
        max_position: 949
        speed_pct: 100
        force_pct: 60
        accel: 2000
        decel: 2000
  - port: /dev/realman/gripper_mid
    baudrate: 115200
    timeout: 0.3
    poll_hz: 20.0
    auto_reconnect: true
    reconnect_interval: 5.0
    command_quiet_s: 0.2           # 目标持续到达的判定间隔
    streaming_poll_interval: 0.5   # 连续控制期间的反馈轮询周期（越大下发越稳）
    min_command_interval_s: 0.25   # 连续目标的最小触发间隔；实测 20 Hz 触发夹爪不动，4 Hz 最快
    command_deadband: 0.01         # 与上次目标相差小于行程该比例则不重发（全开/全闭端点除外）
    grippers:
      - name: gripper_mid
        slave_id: 1
        open_position: 0
        close_position: 9000
        min_position: 0
        max_position: 9000
        speed_pct: 100
        force_pct: 100
        accel: 2000
        decel: 2000
